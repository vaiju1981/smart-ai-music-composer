<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OSMD render harness</title>
    <style>
      /* Deterministic canvas: fixed white page, no user styles. */
      body { margin: 0; background: #fff; }
      #osmd-container { padding: 24px; }
    </style>
  </head>
  <body>
    <div id="osmd-container"></div>
    <!-- OSMD ships a prebuilt UMD bundle; the path reaches the repo's
         node_modules from this file's directory. -->
    <script src="../../node_modules/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js"></script>
    <script src="./viewer.js"></script>
  </body>
</html>
